# Lutris
- name: Get latest Lutris release info
  ansible.builtin.shell: |
    TAG=$(curl -s https://api.github.com/repos/lutris/lutris/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
    curl -sL "https://github.com/lutris/lutris/releases/download/${TAG}/lutris_${TAG#v}_all.deb" -o /tmp/lutris.deb
    file /tmp/lutris.deb
  changed_when: false
- name: Install a .deb package for Lutris
  apt:
    deb: /tmp/lutris.deb
  when: ansible_os_family == "Debian"
  ignore_errors: true
