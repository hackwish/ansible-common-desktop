# UPDATE
- name: Update all packages (Ubuntu based)
  apt:
    name: "*"
    state: latest
  when: ansible_distribution == 'Ubuntu'

# UPGRADE
- name: Upgrading all packages (Debian/Ubuntu)
  apt:
    upgrade: 'yes'
  when: ansible_os_family == "Debian"

- name: Upgrading all dist packages (Debian/Ubuntu)
  apt:
    upgrade: dist
  when: ansible_os_family == "Debian"

- name: Upgrading all packages (Fedora/RHEL)
  dnf:
    name: '*'
    state: latest
  when: ansible_os_family == "RedHat"
