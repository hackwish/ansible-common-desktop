      - cups-bsd
      - cups-client
      - cups-image-devel
      - sane-backends-devel
      - avahi-devel
      - xsane
      - python3-notify2
      - python3-reportlab
      - libusb-devel
      - "@development-tools"
  ignore_errors: true
  tags: common

- name: Install kernel headers (Fedora)
  dnf:
    name: "kernel-devel-{{ ansible_kernel }}"
    state: present
  ignore_errors: true
  tags: common

# Google Chrome repo for Fedora
- name: Add Google Chrome repo (Fedora)
  yum_repository:
    name: google-chrome
    description: Google Chrome Repository
    baseurl: http://dl.google.com/linux/chrome/rpm/stable/x86_64
    enabled: yes
    gpgcheck: yes
    gpgkey: https://dl.google.com/linux/linux_signing_key.pub
  when: ansible_os_family == "RedHat"

- name: Install Google Chrome (Fedora)
  dnf:
    name: google-chrome-stable
    state: present
  when: ansible_os_family == "RedHat"
  ignore_errors: true

# Flatpak on Fedora
- name: Add Flathub remote (Fedora)
  flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
  when: ansible_os_family == "RedHat"

- name: Install Flatpak packages (Fedora)
  community.general.flatpak:
    name: "{{ packages }}"
    method: user
  vars:
    packages:
      - com.microsoft.Edge
      - com.mojang.Minecraft
      - org.openshot.OpenShot
      - org.jitsi.jitsi-meet
      - com.github.tchx84.Flatseal
      - com.github.marktext.marktext
  when: ansible_os_family == "RedHat"

# Snap on Fedora
- name: Enable snapd service (Fedora)
  systemd:
    name: snapd
    enabled: yes
    state: started
  when: ansible_os_family == "RedHat"

- name: Install Snap packages (Fedora)
  community.general.snap:
    name: "{{ packages }}"
  vars:
    packages:
      - discord
      - spotify
      - signal-desktop
      - slack
      - inkscape
      - gimp
      - krita
      - doctl
  when: ansible_os_family == "RedHat"
