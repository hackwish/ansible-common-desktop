- name: Install additional requested packages (Fedora)
  dnf:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - net-snmp
      - net-snmp-utils
      - epiphany
      - etherwake
      - rclone
      - qpdf
      - poppler-utils
      - iperf3
      - libnotify
      - wkhtmltopdf
      - ghostwriter
      - cloud-utils
      - samba
      - mokutil
      - kernel-devel
      - cups-devel
      - pipx
      - wxPython
